name: Build rusEFI Stage 1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          sudo apt-get install -y binutils-arm-none-eabi
          sudo apt-get install -y libnewlib-arm-none-eabi
          sudo apt-get install -y make
          sudo apt-get install -y mtools

          echo "===== CHECK MCOPY ====="
          command -v mcopy
          mcopy -V
          echo "===== MCOPY OK ====="

      - name: Check custom board files
        working-directory: firmware
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== BOARDS DIRECTORY ====="
          ls -la config/boards/

          echo "===== DEVBOX DIRECTORY ====="
          ls -la config/boards/devebox-f407/

          echo "===== META INFO ====="
          cat config/boards/devebox-f407/meta-info.env

      - name: Check meta-info content
        working-directory: firmware
        run: |
          echo "===== META-INFO FILE CONTENT ====="
          cat config/boards/devebox-f407/meta-info.env

          echo "===== BOARD DIRECTORY CONTENT ====="
          ls -la config/boards/devebox-f407/

          echo "===== CHECK PROJECT_BOARD ====="
          grep -n "PROJECT_BOARD" config/boards/devebox-f407/meta-info.env || true

          echo "===== CHECK SHORT_BOARD_NAME ====="
          grep -n "SHORT_BOARD_NAME" config/boards/devebox-f407/meta-info.env || true

      - name: Diagnose make
        working-directory: firmware
        run: |
          echo "===== MAKEFILE ====="
          ls -l Makefile

          echo "===== MAKEFILE FIRST 30 LINES ====="
          head -30 Makefile

          echo "===== MAKEFILE LAST 30 LINES ====="
          tail -30 Makefile

          echo "===== BOARD MK ====="
          ls -l config/boards/devebox-f407/board.mk

          echo "===== META INFO ====="
          cat config/boards/devebox-f407/meta-info.env

          echo "===== MAKE VERSION ====="
          make --version

          echo "===== MAKE TARGET CHECK ====="
          make -qp \
            PROJECT_BOARD=devebox-f407 \
            PROJECT_CPU=ARCH_STM32F4 \
            BOARD_DIR=config/boards/devebox-f407 \
            2>&1 | grep -E '^(all|bundle|config|docs-enums|bootloader|clean):' | head -30 || true

      - name: Compile devebox-f407
        working-directory: firmware
        run: |
          chmod +x bin/compile.sh
          ./bin/compile.sh config/boards/devebox-f407/meta-info.env

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rusefi-devebox-f407
          path: |
            firmware/**/*.bin
            firmware/**/*.elf
            firmware/**/*.hex
          if-no-files-found: warn
