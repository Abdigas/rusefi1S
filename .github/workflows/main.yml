name: Build rusEFI Stage 1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          sudo apt-get install -y binutils-arm-none-eabi
          sudo apt-get install -y libnewlib-arm-none-eabi
          sudo apt-get install -y make
          sudo apt-get install -y mtools

      - name: Check custom board files
        working-directory: firmware
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== BOARDS DIRECTORY ====="
          ls -la config/boards/

          echo "===== DEVBOX DIRECTORY ====="
          ls -la config/boards/devebox-f407/

          echo "===== META INFO ====="
          cat config/boards/devebox-f407/meta-info.env

      - name: Compile devebox-f407
        working-directory: firmware
        run: |
          chmod +x bin/compile.sh
          ./bin/compile.sh config/boards/devebox-f407/meta-info.env

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rusefi-devebox-f407
          path: |
            firmware/**/*.bin
            firmware/**/*.elf
            firmware/**/*.hex
          if-no-files-found: warn
