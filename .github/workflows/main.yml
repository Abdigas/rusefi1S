```yaml
name: Build rusEFI Stage 1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            make \
            mtools

      - name: Verify mtools
        run: |
          echo "Checking mcopy..."
          which mcopy
          mcopy -V

      - name: Compile f407-discovery
        working-directory: firmware
        run: |
          chmod +x bin/compile.sh
          ./bin/compile.sh config/boards/f407-discovery/meta-info.env

      - name: Show build result
        run: |
          echo "Build finished"
          find firmware -type f \( \
            -name "*.bin" -o \
            -name "*.elf" -o \
            -name "*.hex" \
          \) -print
```
